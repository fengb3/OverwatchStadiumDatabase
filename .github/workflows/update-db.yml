name: Update Database

on:
  schedule:
    # Twice a month (1st and 15th) ~ every two weeks.
    # Stadium mode is no longer receiving content updates, only bug fixes, so daily sync is unnecessary.
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-db:
    # Playwright 1.57.0 does not support the Ubuntu 26.04 runner.
    runs-on: ubuntu-24.04
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build Worker project
        run: dotnet build OverwatchStadiumDatabase.Worker/OverwatchStadiumDatabase.Worker.csproj -c Release

      - name: Ensure SQLite DB file is valid
        shell: bash
        run: |
          set -euo pipefail
          DB="Data/overwatch_stadium.db"
          # If it's missing, empty, or not a real SQLite file, recreate it.
          if [ ! -f "$DB" ] || [ ! -s "$DB" ]; then
            echo "DB missing/empty -> recreate"
            rm -f "$DB" || true
            : > "$DB"
          fi
          if [ -f "$DB" ]; then
            head -c 16 "$DB" | grep -q "SQLite format 3" || (
              echo "DB is not a SQLite database (maybe LFS pointer or corrupt). Recreating...";
              rm -f "$DB";
              : > "$DB";
            )
          fi

      - name: Install Playwright Chromium and dependencies
        # Use the installer generated by the project's Microsoft.Playwright package.
        run: pwsh OverwatchStadiumDatabase.Worker/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Run Worker
        run: dotnet run --project OverwatchStadiumDatabase.Worker/OverwatchStadiumDatabase.Worker.csproj -c Release

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f Data/overwatch_stadium.db Data/full_data_dump.sql
          git commit -m "Update database with latest data" || echo "No changes to commit"
          git push
